# Moodle Plugin CI for local_aigrader.
#
# Mirrors the checks the Plugin Directory peer reviewers run (and a few
# more) against every push and PR. Runs across the Moodle versions the
# plugin claims to support (4.5 LTS being the minimum per version.php).
#
# We use moodlehq/moodle-plugin-ci which is the canonical action for
# Moodle plugins — it spins up a matching Moodle, MySQL/PostgreSQL,
# installs the plugin, and runs phpcs, phpmd, phpdoc, phpunit, behat,
# mustache lint, savepoints check, plugin metadata validation, etc.
#
# Maintained by Moodle HQ:
#   https://github.com/moodlehq/moodle-plugin-ci

name: Moodle Plugin CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-22.04
    # The next Moodle (main) is still in development: report it, don't block on it.
    continue-on-error: ${{ matrix.experimental }}

    services:
      postgres:
        image: postgres:${{ matrix.pgsql }}
        env:
          POSTGRES_USER: 'postgres'
          POSTGRES_HOST_AUTH_METHOD: 'trust'
        ports:
          - 5432:5432
        options: >-
          --health-cmd="pg_isready"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=8

      mariadb:
        image: mariadb:${{ matrix.mariadb }}
        env:
          MYSQL_USER: 'root'
          MYSQL_ALLOW_EMPTY_PASSWORD: "true"
          MYSQL_CHARACTER_SET_SERVER: "utf8mb4"
          MYSQL_COLLATION_SERVER: "utf8mb4_unicode_ci"
        ports:
          - 3306:3306
        options: >-
          --health-cmd="mysqladmin ping"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=8

    strategy:
      fail-fast: false
      matrix:
        # Every supported Moodle branch from 4.5 LTS (the minimum in
        # version.php) to the one in development, each with its lowest
        # PHP on PostgreSQL and its highest PHP on MariaDB. Database
        # versions follow each branch's admin/environment.xml minimum:
        # 5.1 needs PostgreSQL 15, 5.2 needs 16, 5.3 needs 17. The main
        # job runs on PostgreSQL only; its MariaDB service stays on 10.11
        # because the 11.x images no longer ship the mysqladmin used by
        # the health check.
        include:
          - {moodle-branch: 'MOODLE_405_STABLE', php: '8.1', database: 'pgsql', pgsql: '14', mariadb: '10.11', experimental: false}
          - {moodle-branch: 'MOODLE_405_STABLE', php: '8.3', database: 'mariadb', pgsql: '14', mariadb: '10.11', experimental: false}
          - {moodle-branch: 'MOODLE_500_STABLE', php: '8.2', database: 'pgsql', pgsql: '14', mariadb: '10.11', experimental: false}
          - {moodle-branch: 'MOODLE_500_STABLE', php: '8.4', database: 'mariadb', pgsql: '14', mariadb: '10.11', experimental: false}
          - {moodle-branch: 'MOODLE_501_STABLE', php: '8.2', database: 'pgsql', pgsql: '15', mariadb: '10.11', experimental: false}
          - {moodle-branch: 'MOODLE_501_STABLE', php: '8.4', database: 'mariadb', pgsql: '15', mariadb: '10.11', experimental: false}
          - {moodle-branch: 'MOODLE_502_STABLE', php: '8.3', database: 'pgsql', pgsql: '16', mariadb: '10.11', experimental: false}
          - {moodle-branch: 'MOODLE_502_STABLE', php: '8.4', database: 'mariadb', pgsql: '16', mariadb: '10.11', experimental: false}
          - {moodle-branch: 'main', php: '8.3', database: 'pgsql', pgsql: '17', mariadb: '10.11', experimental: true}

    steps:
      - name: Check out plugin code
        uses: actions/checkout@v4
        with:
          path: plugin

      - name: Set up PHP ${{ matrix.php }}
        uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ matrix.php }}
          extensions: zip, gd, soap, intl, ldap, mbstring, pgsql, mysqli, xmlrpc
          ini-values: max_input_vars=5000
          coverage: none

      - name: Initialise moodle-plugin-ci
        run: |
          composer create-project -n --no-dev --prefer-dist moodlehq/moodle-plugin-ci ci ^4
          # Tell PHP where Composer's vendor/bin lives.
          echo $(cd ci/bin; pwd) >> $GITHUB_PATH
          echo $(cd ci/vendor/bin; pwd) >> $GITHUB_PATH
          sudo locale-gen en_AU.UTF-8
          echo "NVM_DIR=$HOME/.nvm" >> $GITHUB_ENV

      - name: Install Moodle + plugin
        run: moodle-plugin-ci install --plugin ./plugin --db-host=127.0.0.1
        env:
          DB: ${{ matrix.database }}
          MOODLE_BRANCH: ${{ matrix.moodle-branch }}

      - name: PHP Lint
        if: ${{ !cancelled() }}
        run: moodle-plugin-ci phplint

      - name: PHP Mess Detector
        continue-on-error: true
        if: ${{ !cancelled() }}
        run: moodle-plugin-ci phpmd

      # Moodle Code Checker is run without --max-warnings 0 because
      # moodle-plugin-ci hardcodes --standard=moodle which bypasses
      # PHP_CodeSniffer's auto-detection of .phpcs.xml.dist. With the
      # zero-warnings flag, stylistic conventions we deliberately keep
      # (comment-separator dots, lang-file grouping, backticks in
      # audit-log strings) would fail the build. Plugin Directory peer
      # reviewers don't reject for warnings either — they reject for
      # errors. We do fail the build on phpcs ERRORS (exit code != 0).
      - name: Moodle Code Checker
        if: ${{ !cancelled() }}
        run: moodle-plugin-ci phpcs

      # PHPDoc Checker runs strict — after the v1.0.25 docblock sweep, every
      # function has a complete @param list and a @return tag where applicable.
      - name: Moodle PHPDoc Checker
        if: ${{ !cancelled() }}
        run: moodle-plugin-ci phpdoc

      - name: Validating
        if: ${{ !cancelled() }}
        run: moodle-plugin-ci validate

      - name: Check upgrade savepoints
        if: ${{ !cancelled() }}
        run: moodle-plugin-ci savepoints

      - name: Mustache Lint
        if: ${{ !cancelled() }}
        run: moodle-plugin-ci mustache

      - name: Grunt
        if: ${{ !cancelled() }}
        run: moodle-plugin-ci grunt --max-lint-warnings 0

      - name: PHPUnit tests
        if: ${{ !cancelled() }}
        run: moodle-plugin-ci phpunit --fail-on-warning

      - name: Behat features
        if: ${{ !cancelled() }}
        run: moodle-plugin-ci behat --profile chrome
